<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap">
<style>

    s.m.push(o.m); s.obs.push(o); }
  const lane = T.x + (narrow ? 0 : rn(-w / 3, w / 3)), add = (type, x, z, extra) => { const it = { type, x, y: T.y, z, ...extra }; it.m = type === 'coin' ? put(G.coin, MT.coin, x, T.y + .75, z) : type === 'pad' ? put(G.pad, MT.pad, x, T.y + .02, z) : type === 'gate' ? put(G.ring, MT.gate, x, T.y + 2.3, z, w / 5) : put(G.orb, orbM[type], x, T.y + 1, z); items.push(it); };
  if (!fin && Math.random() < .75) for (let k = 0; k < Math.min(8, l / 2.2); k++) add('coin', lane, z0 - 2 - k * 2.2);
  if (!first && !fin && Math.random() < .16) add(pick(Object.keys(ORB)), T.x + rn(-w / 3, w / 3), cz);
  if (!first && !fin && !narrow && Math.random() < .14) add('pad', T.x, z0 - l * .3);
  if (!first && !fin && !narrow && Math.random() < .08) add('gate', T.x, z0 - l * .6, { skin: pick(SKINS.filter(k => k !== P.skin)) });
  track.push(s); T.z = z1; T.zone -= l + gap; T.n++;
}

/* physics */
const P = { skin: SKINS[0] }, S = { state: 'menu', lvl: st.get('lvl', 1), fx: {}, t: 0 };
const pop = t => { $('#pop').textContent = t; $('#pop').style.opacity = 1; clearTimeout(pop.h); pop.h = setTimeout(() => $('#pop').style.opacity = 0, 1500); };
function reset() {
  track.forEach(s => s.m.forEach(m => scene.remove(m))); items.forEach(i => scene.remove(i.m)); track.length = items.length = 0;
  Object.assign(T, { z: 10, x: 0, y: 0, surf: 0, zone: 120, n: 0, done: false }); Object.assign(P, { x: 0, y: BR, z: 0, vx: 0, vy: 0, vz: -7, g: null, skin: SKINS[0] }); ball.material = P.skin.m;
  Object.assign(S, { t: 0, dist: 0, coins: 0, fx: {}, falls: 0, safe: null, finish: null, len: 200 + S.lvl * 60 }); seg(true); while (T.z > -170 && !T.done) seg(false);
}
const ground = (x, z, y) => track.filter(s => z <= s.z0 + .3 && z >= s.z1 - .3 && Math.abs(x - s.x) <= s.w / 2 && y >= s.y - .4).sort((a, b) => b.y - a.y)[0];
function update(dt) {
  S.t += dt; const sk = P.skin.t, tgt = (7 + 8 * (1 - Math.exp(-S.t / 100))) * (sk === 'extra speed' ? 1.12 : 1) * (S.fx.boost > 0 ? 1.5 : 1), grip = (sk === 'extra grip' ? 1.5 : 1) * (P.g ? 1 : .35);
  P.vz = lp(P.vz, -tgt, 1 - Math.exp(-dt * 1.5)); P.vx = lp(P.vx, steer() * (6 + tgt * .25), 1 - Math.exp(-dt * 4 * grip));
  if (inp.jump && P.g) { P.vy = 7.5; P.g = null; } inp.jump = false;
  P.vy -= 22 * dt; P.x += P.vx * dt; P.y += P.vy * dt; P.z += P.vz * dt;
  const g = ground(P.x, P.z, P.y - BR);
  if (g && P.y - BR <= g.y + .02 && P.vy <= 0) { P.y = g.y + BR; P.vy = 0; P.g = g; S.safe = g; } else P.g = null;
  if (g && P.y < g.y + 1.6) g.rails.forEach((on, i) => { const lim = g.x + (i ? 1 : -1) * (g.w / 2 - .25 - BR); if (on && (i ? P.x > lim : P.x < lim)) { P.x = lim; P.vx *= -.35; } });
  for (const s of track) for (const o of s.obs) { let cx, cz; if (o.type === 'push') { cx = cl(P.x, o.m.position.x - .9, o.m.position.x + .9); cz = cl(P.z, o.z - .55, o.z + .55); }
    else { const a = o.m.rotation.y, ux = Math.cos(a), uz = -Math.sin(a), t = cl((P.x - s.x) * ux + (P.z - o.z) * uz, -o.len, o.len); cx = s.x + ux * t; cz = o.z + uz * t; }
    const dx = P.x - cx, dz = P.z - cz, d = Math.hypot(dx, dz), r = BR + (o.type === 'spin' ? .2 : 0); if (!(d < r) || d < 1e-4 || P.y > s.y + 2) continue;
    if (S.fx.shield > 0) { S.fx.shield = 0; pop('Shield blocked it'); o.cd = S.t + 1; continue; } if (o.cd > S.t) continue;
    P.x = cx + dx / d * r; P.z = cz + dz / d * r; P.vx += dx / d * 4.5; o.cd = S.t + .4; }
  for (const it of items) { if (it.gone) continue; const dx = it.x - P.x, dz = it.z - P.z;
    if (it.type === 'coin' && S.fx.magnet > 0 && Math.abs(dz) < 12) { it.x -= dx * dt * 6; it.z -= dz * dt * 6; it.m.position.set(it.x, it.m.position.y, it.z); }
    if (dx * dx + dz * dz > (it.type === 'gate' ? 6 : 1.3) || Math.abs(it.y + .8 - P.y) > 2.5) continue;
    if (it.type === 'pad') { if (!(S.fx.boost > 0)) pop('Speed boost'); S.fx.boost = 2.5; continue; }
    it.gone = true; scene.remove(it.m);
    if (it.type === 'coin') S.coins += (S.fx.x2 > 0 ? 2 : 1) * (sk === 'coins ×2' ? 2 : 1);
    else if (it.type === 'gate') { P.skin = it.skin; ball.material = it.skin.m; pop(it.skin.n + ' ball · ' + it.skin.t); }
    else { S.fx[it.type] = it.type === 'shield' ? 25 : 10; pop({ x2: 'Double coins', magnet: 'Coin magnet', shield: 'Shield' }[it.type]); } }
  if (P.y < (S.safe ? S.safe.y : 0) - 12) { const s = S.safe || track[0]; S.falls++; pop('Back to checkpoint'); Object.assign(P, { x: s.x, z: Math.min(s.z0 - 1.5, Math.max(P.z + 4, s.z1 + 2)), y: s.y + 2, vx: 0, vy: 0, vz: P.vz * .4 }); }
  for (const k in S.fx) S.fx[k] -= dt;
  S.dist = Math.max(S.dist, -P.z); while (T.z > P.z - 180 && !T.done) seg(false);
  while (track.length && track[0].z1 > P.z + 30) track.shift().m.forEach(m => scene.remove(m));
  if (S.finish != null && P.z < S.finish) win();
}

/* input: tap left/right halves (or arrow keys) or tilt, any orientation */
const inp = { l: 0, r: 0, tilt: 0, base: null, seen: 0, jump: false };
const hold = (el, k) => { el.onpointerdown = e => { e.preventDefault(); inp[k] = 1; }; el.onpointerup = el.onpointercancel = el.onpointerleave = () => inp[k] = 0; };
hold($('#zl'), 'l'); hold($('#zr'), 'r');
onkeydown = e => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') inp.l = 1; if (e.code === 'ArrowRight' || e.code === 'KeyD') inp.r = 1; if (e.code === 'Space' || e.code === 'ArrowUp') { inp.jump = true; e.preventDefault(); } if (e.code === 'Escape') S.state === 'play' ? pause() : S.state === 'pause' && resume(); };
onkeyup = e => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') inp.l = 0; if (e.code === 'ArrowRight' || e.code === 'KeyD') inp.r = 0; };
$('#jump').onpointerdown = e => { e.preventDefault(); inp.jump = true; };
addEventListener('deviceorientation', e => { if (e.beta == null) return; const a = screen.orientation ? screen.orientation.angle : (window.orientation || 0), v = a === 90 ? e.beta : (a === 270 || a === -90) ? -e.beta : e.gamma; if (inp.base == null) inp.base = v; inp.tilt = v - inp.base; inp.seen = 1; });
const steer = () => cl(inp.r - inp.l + (ctl === 'tilt' && inp.seen ? Math.sign(inp.tilt) * Math.max(0, Math.abs(inp.tilt) - 2) / 15 : 0), -1, 1);

/* screens, onboarding, loop */
const view = id => ['#menu', '#paused', '#won'].forEach(s => $(s).hidden = s !== id);
const paintCtl = () => { document.querySelectorAll('#ctl button').forEach(b => b.classList.toggle('on', b.dataset.v === ctl)); $('#al').hidden = $('#ar').hidden = ctl !== 'tap'; $('#zones').style.pointerEvents = ctl === 'tap' ? 'auto' : 'none'; $('#mlvl').textContent = 'LEVEL ' + S.lvl; };
document.querySelectorAll('#ctl button').forEach(b => b.onclick = () => { ctl = b.dataset.v; st.set('ctl', ctl); paintCtl(); });
const STEPS = [['#prog', 'This bar shows your level. Roll to the FINISH line to fill it.'], [() => ctl === 'tap' ? '#al' : null, () => ctl === 'tap' ? 'Hold the left or right side of the screen to steer. On a laptop, use the arrow keys.' : 'Tilt your phone left or right to steer. Hold it the way you like: sideways or upright.'],
  ['#jump', 'Tap JUMP to hop over gaps (Space bar on a laptop).'], ['#coins', 'Grab coins. Glowing orbs give double coins, a coin magnet or a shield. Orange pads boost you. Gold rings change your ball.'], ['#pause', 'Pause here any time. If you fall, you go back to the last checkpoint. Have fun!']];
function coach(i, done) {
  document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); if (i >= STEPS.length) { $('#coach').hidden = true; st.set('coached', 1); return done(); }
  const [sel, txt] = STEPS[i].map(v => typeof v === 'function' ? v() : v); if (sel) $(sel).classList.add('hl');
  $('#coach').hidden = false; $('#cs').textContent = `STEP ${i + 1} OF ${STEPS.length}`; $('#ct').textContent = txt; $('#cnext').textContent = i === STEPS.length - 1 ? "Let's roll" : 'Next'; $('#cnext').onclick = () => coach(i + 1, done);
}
async function play() {
  try { if (ctl === 'tilt' && DeviceOrientationEvent.requestPermission && await DeviceOrientationEvent.requestPermission() !== 'granted') { ctl = 'tap'; } } catch (e) {}
  inp.base = null; reset(); view(null); $('#hud').hidden = false; paintCtl();
  if (!st.get('coached', 0)) { S.state = 'coach'; coach(0, () => S.state = 'play'); } else S.state = 'play';
}
function win() { S.state = 'won'; $('#hud').hidden = true; $('#pop').style.opacity = 0; $('#wl').textContent = 'Level ' + S.lvl; $('#wc').textContent = S.coins; $('#wt').textContent = S.t.toFixed(1) + 's'; $('#wf').textContent = S.falls; S.lvl++; st.set('lvl', S.lvl); setTimeout(() => view('#won'), 600); }
const pause = () => { if (S.state === 'play') { S.state = 'pause'; view('#paused'); } }, resume = () => { S.state = 'play'; view(null); };
const menu = () => { S.state = 'menu'; $('#hud').hidden = true; reset(); paintCtl(); view('#menu'); };
$('#play').onclick = $('#next').onclick = play; $('#pause').onclick = pause; $('#resume').onclick = resume; $('#quit').onclick = $('#wmenu').onclick = menu;
$('#how').onclick = () => { st.set('coached', 0); play(); };
document.addEventListener('visibilitychange', () => document.hidden && pause());
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame); if (now - last < 16) return; const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S.state === 'play') { update(dt / 2); update(dt / 2); }
  if (S.state === 'menu') { P.z -= 7 * dt; P.vz = -7; while (T.z > P.z - 180 && !T.done) seg(false); const g = ground(P.x, P.z, P.y - BR); if (g) { P.y = g.y + BR; P.g = g; P.x = lp(P.x, g.x, dt); } else reset(); }
  weather(S.state === 'menu' ? dt * 4 : dt);
  for (const s of track) for (const o of s.obs) o.type === 'push' ? o.m.position.x = s.x + Math.sin(now / 700 + o.ph) * o.amp : o.m.rotation.set(0, now / 600 + o.ph, R2);
  for (const it of items) if (it.type === 'coin' || ORB[it.type]) it.m.rotation.y = now / 300 + it.z;
  ball.position.set(P.x, P.y, P.z); const v = Math.hypot(P.vx, P.vz); if (v > .01 && P.g) ball.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(P.vz, 0, -P.vx).normalize(), v * dt / BR));
  shield.visible = S.fx.shield > 0; shield.position.copy(ball.position);
  const port = innerHeight > innerWidth, gy = P.g ? P.g.y : P.y - BR;
  cam.position.lerp(new THREE.Vector3(P.x * .7 + (S.state === 'menu' ? 3 : 0), gy + (port ? 5.5 : 4), P.z + (port ? 8.5 : 7)), 1 - Math.exp(-dt * 5)); cam.lookAt(P.x * .8, gy + .3, P.z - 8);
  sky.position.copy(cam.position); sun.position.set(P.x - 12, gy + 30, P.z + 10); sun.target.position.set(P.x, gy, P.z - 6);
  if (S.state !== 'menu') { const pr = cl(S.dist / S.len, 0, 1); $('#cn').textContent = S.coins; $('#pl').textContent = `LEVEL ${S.lvl} · ${Math.round(pr * 100)}%`; $('#pf').style.width = pr * 100 + '%';
    $('#fx').innerHTML = Object.entries({ x2: '×2 coins', magnet: 'Magnet', shield: 'Shield', boost: 'Boost' }).filter(([k]) => S.fx[k] > 0).map(([k, n]) => `<span class="pill">${n} ${Math.ceil(S.fx[k])}s</span>`).join(''); }
  R.render(scene, cam);
}
if (location.search.includes('debug')) window.__m = { S, P, inp, track, step: s => { for (let i = 0; i < s * 60; i++) update(1 / 60); } };
fit(); reset(); paintCtl(); requestAnimationFrame(frame);
})();
</script></body></html>
