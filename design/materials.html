<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ball materials</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#222}canvas{display:block;width:100%;height:100%}
#lbl{position:fixed;left:18px;bottom:14px;font:700 20px system-ui,sans-serif;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}</style></head>
<body><canvas id="c"></canvas><div id="lbl"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Realistic ball + track material studies. ?c=0..5. Studio lighting only, no scenery. */
(() => {
const PI = Math.PI, R2 = PI / 2;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);
const lin = h => new THREE.Color(h).convertSRGBToLinear();

/* ---------- procedural texture maker: height -> albedo, normal, roughness ---------- */
const N = 512;
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o = 5) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s; }
function maps(fn, normalStrength = 2) { // fn(u,v) -> [r,g,b (0..1), height (0..1), rough (0..1)]
  const H = new Float32Array(N * N), A = new Uint8ClampedArray(N * N * 4), Rg = new Uint8ClampedArray(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const o = fn(x / N, y / N), i = y * N + x; A.set([o[0] * 255, o[1] * 255, o[2] * 255, 255], i * 4); H[i] = o[3]; const r = o[4] * 255; Rg.set([r, r, r, 255], i * 4); }
  const Nm = new Uint8ClampedArray(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const h = (xx, yy) => H[((yy + N) % N) * N + ((xx + N) % N)];
    const dx = (h(x + 1, y) - h(x - 1, y)) * normalStrength, dy = (h(x, y + 1) - h(x, y - 1)) * normalStrength, l = Math.hypot(dx, dy, 1);
    Nm.set([(-dx / l * 0.5 + 0.5) * 255, (dy / l * 0.5 + 0.5) * 255, (1 / l * 0.5 + 0.5) * 255, 255], (y * N + x) * 4); }
  const tex = (data, srgb) => { const c = document.createElement('canvas'); c.width = c.height = N; c.getContext('2d').putImageData(new ImageData(data, N, N), 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 16; if (srgb) t.encoding = THREE.sRGBEncoding; return t; };
  return { map: tex(A, true), normalMap: tex(Nm), roughnessMap: tex(Rg) };
}
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const hex = h => { const c = new THREE.Color(h); return [c.r, c.g, c.b]; };
const TEX = {
  concrete: () => maps((u, v) => { const n = fbm(u * 8, v * 8), p = hash(Math.floor(u * 300), Math.floor(v * 300)) > 0.985 ? -0.25 : 0; const c = mix(hex('#8d8a85'), hex('#b4b0aa'), n); return [...c.map(x => x + p * 0.3), n * 0.4 + p, 0.55 + n * 0.25]; }, 3),
  marble: () => maps((u, v) => { const f = fbm(u * 2.5 + fbm(u * 4, v * 4) * 0.6, v * 2.5, 7); const d = Math.abs(f - 0.5); const vein = Math.max(0, 1 - d / 0.03) * 0.9 + Math.max(0, 1 - Math.abs(fbm(u * 6 + 3, v * 6, 6) - 0.5) / 0.012) * 0.35; const cloud = fbm(u * 5 + 7, v * 5, 6); const base = mix(hex('#101013'), hex('#26242b'), cloud); const c = mix(base, hex('#d8d2c6'), Math.min(1, vein)); return [...c, vein * 0.02, 0.05 + vein * 0.04];}, 1),
  wood: () => maps((u, v) => { const plank = Math.floor(u * 6), seam = Math.abs((u * 6) % 1 - 0.5) > 0.485 ? 1 : 0; const g = Math.sin((u * 70 + fbm(u * 3 + plank * 3.1, v * 1.2) * 5 + Math.sin(v * 9 + plank) * 0.6) * PI) * 0.5 + 0.5; const tone = hash(plank, 1) * 0.25;
    const c = mix(hex('#6b3f1f'), hex('#b07a46'), g * 0.55 + tone); return [...c.map(x => seam ? x * 0.35 : x), seam ? -0.4 : g * 0.12, seam ? 0.9 : 0.35 + g * 0.15]; }, 3),
  acrylic: () => maps((u, v) => { const n = fbm(u * 30, v * 30) * 0.03; return [0.015 + n, 0.015 + n, 0.02 + n, n, 0.03 + n]; }, 1),
  oak: () => maps((u, v) => { const g = Math.sin((u * 46 + fbm(u * 2, v * 0.7, 6) * 4) * PI) * 0.5 + 0.5; const fleck = fbm(u * 80, v * 6) > 0.72 ? 0.15 : 0; const c = mix(hex('#c79b66'), hex('#e6caa0'), g * 0.7 + 0.15 - fleck); return [...c, g * 0.05, 0.45];}, 2),
  brushed: () => maps((u, v) => { const s = fbm(u * 2, v * 260, 3); const c = mix(hex('#8e9399'), hex('#c4c9cf'), s); return [...c, s * 0.15, 0.25 + s * 0.2]; }, 2),
  // ball surfaces
  pebble: () => maps((u, v) => { const cx = u * 90, cy = v * 45, fx = cx - Math.floor(cx) - 0.5, fy = cy - Math.floor(cy) - 0.5, d = Math.hypot(fx, fy); const bump = Math.max(0, 0.42 - d) * 2.2;
    const seam = Math.min(Math.abs(Math.sin(u * PI * 4)), Math.abs(v - 0.5) * 8) < 0.04 ? 1 : 0; const c = seam ? hex('#1a120c') : mix(hex('#c4521c'), hex('#e0712e'), bump); return [...c, seam ? -0.5 : bump * 0.6, seam ? 0.7 : 0.55]; }, 3),
  carbon: () => maps((u, v) => { const x = u * 64, y = v * 32, a = (Math.floor(x) + Math.floor(y)) % 2, f = a ? x - Math.floor(x) : y - Math.floor(y); const sheen = Math.sin(f * PI); const c = mix(hex('#0c0d10'), hex('#2c2f36'), sheen); return [...c, sheen * 0.3, 0.3]; }, 2),
  clay: () => maps((u, v) => { const n = fbm(u * 40, v * 20); const c = mix(hex('#e9e4dc'), hex('#f6f2ec'), n); return [...c, n * 0.25, 0.75]; }, 1.5)
};

/* ---------- studio environment for reflections: soft boxes in a grey room ---------- */
function studioEnv(tint) {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: lin(tint), side: THREE.BackSide })));
  const panel = (w, h, x, y, z, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m); };
  panel(34, 12, 0, 35, 0, 14); panel(14, 34, -40, 10, 10, 7); panel(14, 34, 40, 8, -10, 5); panel(50, 8, 0, 6, -45, 3); panel(60, 8, 0, 4, 45, 2); panel(90, 90, 0, -40, 0, 0.55);
  return new THREE.PMREMGenerator(renderer).fromScene(s, 0.02).texture;
}

const LOOKS = [
  { name: '1. Chrome ball on polished concrete', bg: ['#3a3d42', '#16181b'], env: '#404448', ground: 'concrete', gRough: 0.6, gRep: [2, 6], edge: '#2a2c30',
    ball: () => new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.04 }) },
  { name: '2. Glass marble on black marble', bg: ['#2b2a33', '#0d0c12'], env: '#353340', ground: 'marble', gRep: [1, 3], edge: '#111114',
    ball: () => new THREE.MeshPhysicalMaterial({ color: lin('#bfe8ff'), metalness: 0, roughness: 0.02, transmission: 0.96, thickness: 1.6, ior: 1.5, clearcoat: 1, transparent: true }), core: true },
  { name: '3. Rubber sports ball on wood planks', bg: ['#4a4038', '#1c1713'], env: '#5a4a3a', ground: 'wood', gRep: [1, 4], edge: '#3a2414',
    ball: () => Object.assign(new THREE.MeshPhysicalMaterial({ roughness: 0.6, clearcoat: 0.25, clearcoatRoughness: 0.4 }), TEX.pebble(), { normalScale: new THREE.Vector2(1.2, 1.2) }) },
  { name: '4. Gold ball on black acrylic', bg: ['#2a2622', '#0a0908'], env: '#3a332b', ground: 'acrylic', gRep: [1, 3], edge: '#050505', gMetal: 0.0, gClear: 1,
    ball: () => new THREE.MeshPhysicalMaterial({ color: lin('#ffcc66'), metalness: 1, roughness: 0.12 }) },
  { name: '5. Ceramic ball on light oak', bg: ['#e8e4de', '#bdb6ab'], env: '#cfc8bd', ground: 'oak', gRep: [1, 3], edge: '#9b7a54', light: true,
    ball: () => Object.assign(new THREE.MeshPhysicalMaterial({ roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.15 }), TEX.clay()) },
  { name: '6. Carbon fibre ball on brushed aluminium', bg: ['#33373c', '#121417'], env: '#3c4147', ground: 'brushed', gRep: [1, 3], edge: '#1a1c1f', gMetal: 1,
    ball: () => Object.assign(new THREE.MeshPhysicalMaterial({ metalness: 0.2, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.05 }), TEX.carbon()) }
];
const L = LOOKS[+(new URLSearchParams(location.search).get('c') || 0)] || LOOKS[0];
document.getElementById('lbl').textContent = L.name;

// clean studio backdrop: soft vertical gradient, fog into the distance
scene.background = (() => { const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, L.bg[0]); gr.addColorStop(1, L.bg[1]); g.fillStyle = gr; g.fillRect(0, 0, 4, 512); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; })();
scene.fog = new THREE.Fog(lin(L.bg[1]), 18, 60);
scene.environment = studioEnv(L.env);
const key = new THREE.DirectionalLight(0xfff6ea, 3.2); key.position.set(-4, 9, 5); key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 6;
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -14, near: 0.5, far: 40 }); key.shadow.bias = -0.0002; key.shadow.normalBias = 0.02; key.target.position.set(0, 0, -3); scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xdde8ff, 1.2); rim.position.set(5, 3, -8); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, L.light ? 0.5 : 0.25));

// the track: rounded slabs, real material on top, darker material on the sides
function slab(w, l, x, y, z) {
  const s = new THREE.Shape(), r = Math.min(0.5, w / 4); s.moveTo(-w / 2 + r, -l / 2); s.lineTo(w / 2 - r, -l / 2); s.quadraticCurveTo(w / 2, -l / 2, w / 2, -l / 2 + r); s.lineTo(w / 2, l / 2 - r); s.quadraticCurveTo(w / 2, l / 2, w / 2 - r, l / 2); s.lineTo(-w / 2 + r, l / 2); s.quadraticCurveTo(-w / 2, l / 2, -w / 2, l / 2 - r); s.lineTo(-w / 2, -l / 2 + r); s.quadraticCurveTo(-w / 2, -l / 2, -w / 2 + r, -l / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.8, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 4, curveSegments: 16 }); g.rotateX(R2);
  const T = TEX[L.ground](); for (const k of ['map', 'normalMap', 'roughnessMap']) { T[k].repeat.set(1 / w * L.gRep[0] * w / 3, 1 / L.gRep[1]); }
  const top = new THREE.MeshPhysicalMaterial(Object.assign({ metalness: L.gMetal || 0, roughness: 1, clearcoat: L.gClear || (L.ground === 'marble' ? 1 : L.ground === 'wood' ? 0.4 : 0), clearcoatRoughness: 0.05, normalScale: new THREE.Vector2(0.8, 0.8) }, T));
  const side = new THREE.MeshPhysicalMaterial({ color: lin(L.edge), roughness: 0.4, metalness: L.gMetal ? 0.8 : 0, clearcoat: 0.3 });
  const m = new THREE.Mesh(g, [top, side]); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
slab(5, 12, 0, 0, -2); slab(2.2, 10, 0, 0, -14.6); slab(5, 6, 0, 0, -23.2);

// the ball
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.6, 96, 64), L.ball()); ball.position.set(0.35, 0.6 + 0.06, 0.6); ball.rotation.set(0.5, 0.8, 0.2); ball.castShadow = true; ball.receiveShadow = true; scene.add(ball);
if (L.core) { const swirl = new THREE.Mesh(new THREE.TorusKnotGeometry(0.22, 0.05, 160, 16, 2, 3), new THREE.MeshPhysicalMaterial({ color: lin('#ff4a6a'), roughness: 0.2, clearcoat: 1 })); swirl.position.copy(ball.position); scene.add(swirl); }
// contact shadow: a soft dark ellipse right under the ball grounds it
{ const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(0,0,0,0.75)'); r.addColorStop(0.5, 'rgba(0,0,0,0.25)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const cs = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5).rotateX(-R2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })); cs.position.set(ball.position.x, 0.065, ball.position.z); scene.add(cs); }

camera.position.set(1.9, 1.55, 4.2); camera.lookAt(0.1, 0.35, -2.2);
function draw() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.render(scene, camera); }
addEventListener('resize', draw); draw();
})();
</script></body></html>
